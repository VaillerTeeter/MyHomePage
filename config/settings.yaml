---
# 修改此文件后，需要点击页面右下角的刷新图标重新生成静态 HTML 才能生效

# 基础页面设置
# ----------------------------------------------------------------------------------------------------
# 标题与描述
# ==================================================
# 自定义页面标题
title: Vaciller's Homepage
# 自定义页面描述
description: Vaciller's private homepage
# 自定义 favicon（支持 URL 或本地路径）
favicon: /images/homepage_logo.png
# URL
# ==================================================
# 起始 URL，用于可安装应用的启动地址，默认值为 /
startUrl: https://homepage.vaciller.top/
# 语言设置
# ==================================================
# 支持：ca, de, en, es, fr, he, hr, hu, it, nb-NO, nl, pt, ru, sv, vi, zh-CN, zh-Hant
language: en

# 背景图片设置
# ----------------------------------------------------------------------------------------------------
# 基本背景图片
# ==================================================
# Note:
#   - 添加新图片时需要重启容器（Next.js 静态站点服务器的限制）
#   - 不要将整个 /app/public/ 目录进行绑定挂载
# 方式一：使用完整 URL
# background: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
# 方式二：使用本地图片（相对于 /app/public 目录）
# background: /images/background.png
# 背景滤镜与透明度
# ==================================================
# Note:
#   - 用了这个就不用上面的那个
background:
  image: /images/background.png
  # 模糊，背景毛玻璃效果：sm, "", md, xl... 参见 https://tailwindcss.com/docs/backdrop-blur
  blur: none
  # 饱和度：0, 50, 100... 参见 https://tailwindcss.com/docs/backdrop-saturate
  saturate: 200
  # 亮度：0, 50, 75... 参见 https://tailwindcss.com/docs/backdrop-brightness
  brightness: 100
  # 透明度：0-100（与背景色混合）
  opacity: 100
# 卡片模糊效果
# ==================================================
# Note:
#   - 此选项与背景的 blur/saturate/brightness 滤镜不兼容
# 卡片背景毛玻璃效果：xs, md 等... 参见 https://tailwindcss.com/docs/backdrop-blur
cardBlur: sm

# 主题与外观
# ----------------------------------------------------------------------------------------------------
# 固定主题
# ==================================================
# 主题，配置后将禁用主题切换、
# 可选值：dark, light
theme: dark
# 固定配色
# ==================================================
# 调色板，配置后将禁用调色板调色，强制使用指定配色
# 支持：slate, gray, zinc, neutral, stone, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink, rose, red, white
color: slate
# 图标样式
# ==================================================
# 可选：theme（扁平，适配主题色）或 gradient（默认，渐变效果）
iconStyle: theme
# 标题样式
# ==================================================
# 头部样式
# 支持 4 种标题样式（默认为 underlined）
# # 可选：underlined/boxed/clean/boxedWidgets
headerStyle: boxedWidgets

# 布局设置（核心功能）
# ----------------------------------------------------------------------------------------------------
# 全宽布局
# ==================================================
# 使主页占据整个窗口宽度
fullWidth: true
# 最大组列数
# ==================================================
# 设置大屏幕上的最大组列数（仅适用于默认 style: columns，不适用于 style: row）
# 默认服务 4，书签 6，最大 8，最小 5
maxGroupColumns: 5
# 书签组单独设置，最大 8
maxBookmarkGroupColumns: 6
# 可折叠组
# ==================================================
# 全局禁用可折叠功能（默认启用）
disableCollapse: false
# 全局初始折叠，默认禁用
groupsInitiallyCollapsed: false
# 等高卡片
# ==================================================
# 全局等高卡片设置
useEqualHeights: true

# 链接行为
# ----------------------------------------------------------------------------------------------------
# 全局链接目标
# ==================================================
# 可选：_blank（新标签页）、_self（当前标签页）、_top（新窗口）
target: _self

# 快速启动（Quick Launch）
# ----------------------------------------------------------------------------------------------------
# 通过键盘输入快速搜索服务、执行网页搜索或打开 URL
# ==================================================
quicklaunch:
  # 搜索是否包含描述（默认 false）
  searchDescriptions: true
  # 隐藏网络搜索选项（默认 false）
  hideInternetSearch: true
  # 显示搜索建议（默认 false）
  showSearchSuggestions: true
  # 隐藏访问 URL 选项（默认 false）
  hideVisitURL: true
  # 移动端按钮位置：top-left, top-right, bottom-left, bottom-right（默认空，禁用）
  mobileButtonPosition: top-left
  # 搜索引擎
  # 可选：google, duckduckgo, bing, baidu, brave, custom
  provider: bing

# 其他设置
# ----------------------------------------------------------------------------------------------------
# 版本与更新检查
# ==================================================
# 隐藏页面底部版本号
hideVersion: true
# 禁用 GitHub 更新检查（默认启用）
disableUpdateCheck: true
# Docker/Proxmox 容器统计
# ==================================================
# 全局显示所有容器统计
showStats: true
# 状态显示样式
# ==================================================
# 可选：dot（绿色圆点）、basic（显示 UP/DOWN），默认显示响应时间（ms）
statusStyle: "dot"
# 实例名称
# ==================================================
# 用于自动 Docker 服务发现，区分多个 Homepage 实例
instanceName: "Vaciller's Homepage"
# API 错误消息
# ==================================================
# 全局隐藏 API 错误消息（默认显示）
hideErrors: true
