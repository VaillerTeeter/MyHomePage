# 用于在 Kubernetes 集群中自动发现和监控服务

# 前置要求
# ----------------------------------------------------------------------------------------------------
# Kubernetes 版本：1.19+
# Metrics Service：需要部署 Metrics Server
# Ingress 控制器：必须配置 Ingress Controller
# Gateway API（可选）：如果使用 Gateway API 需要相应支持

# Kubernetes 连接配置
# ----------------------------------------------------------------------------------------------------
# 配置模式选项
# ==================================================
# 模式一：禁用 Kubernetes 连接
mode: disabled
# 模式二：使用默认 kubeconfig 解析（默认）
# mode: default
# 模式三：使用集群内 ServiceAccount
# mode: cluster
# 启用服务发现
# ==================================================
# ToDo:
# 仅启用 Ingress（默认）
# ingress: true
# 同时启用 Ingress、Traefik 和 Gateway API
# 启用 Ingress
ingress: false
# 启用 Traefik IngressRoute
traefik: false
# 启用 Gateway API
gateway: false

# 服务配置
# ----------------------------------------------------------------------------------------------------
# 基础 Pod 监控
# ==================================================
# 将服务连接到 Kubernetes Pod 以显示 CPU 和内存统计
# 标签选择器：下面的配置会匹配标签为 app.kubernetes.io/name=emby 的 Pod
# ToDo:
# - Emby:
#     icon: emby.png
#     href: "http://emby.home/"
#     description: Media server
#     # Kubernetes 命名空间
#     namespace: media
#     # 应用名称，用于创建标签选择器
#     app: emby
# 高级 Pod 选择器
# ==================================================
# 对于复杂或非标准部署，使用 podSelector 实现更强大的选择能力
# 特殊用法：空字符串 podSelector: "" 会选择命名空间内的所有 Pod，适用于监控整个命名空间资源（如 Longhorn）
# ToDo:
# - Element Chat:
#     icon: matrix-light.png
#     href: https://chat.example.com
#     description: Matrix Synapse Powered Chat
#     app: matrix-element
#     namespace: comms
#     podSelector: >-
#       app.kubernetes.io/instance in (
#           matrix-element,
#           matrix-media-repo,
#           matrix-media-repo-postgresql,
#           matrix-synapse
#       )

# 自动服务发现
# ----------------------------------------------------------------------------------------------------
# Ingress 注解方式
# ==================================================
# 通过 Ingress 注解自动发现服务，所有配置选项以 gethomepage.dev/ 为前缀
# 关键特性：
#   - 无需手动指定：namespace 和 app 会自动推断
#   - Pod 选择器：通过 pod-selector 指定健康检查使用的 Pod
#   - 多实例支持：通过 instance 注解限制服务在特定 Homepage 实例显示
# ToDo:
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: emby
#   annotations:
#     gethomepage.dev/enabled: "true"
#     gethomepage.dev/description: Media Server
#     gethomepage.dev/group: Media
#     gethomepage.dev/icon: emby.png
#     gethomepage.dev/name: Emby
#     gethomepage.dev/widget.type: "emby"
#     gethomepage.dev/widget.url: "https://emby.example.com"
#     gethomepage.dev/pod-selector: ""
#     gethomepage.dev/weight: "10"  # 可选：排序权重
#     gethomepage.dev/instance: "public"  # 可选：实例限制
# spec:
#   rules:
#     - host: emby.example.com
#       http:
#         paths:
#           - backend:
#               service:
#                 name: emby
#                 port:
#                   number: 8080
#             path: /
#             pathType: Prefix
# 多实例配置
# ==================================================
# ToDo:
# 单实例限制，仅在名为 public 的实例显示
# gethomepage.dev/instance: "public"
# 多实例显示
# 在多个特定实例显示（但不在所有实例显示）
# gethomepage.dev/instance.public: ""
# gethomepage.dev/instance.internal: ""
# Traefik IngressRoute 支持
# ==================================================
# 对于 Traefik 的 IngressRoute CRD，必须设置 href 注解
# 如果未设置 href 属性，Homepage 将忽略该 IngressRoute
# ToDo:
# apiVersion: traefik.io/v1alpha1
# kind: IngressRoute
# metadata:
#   name: emby
#   annotations:
#     gethomepage.dev/href: "https://emby.example.com"  # 必需
#     gethomepage.dev/enabled: "true"
#     gethomepage.dev/description: Media Server
#     gethomepage.dev/group: Media
#     gethomepage.dev/icon: emby.png
#     gethomepage.dev/app: emby-app  # 可选：当 app.kubernetes.io/name ≠ ingress 元数据名称时需要
#     gethomepage.dev/name: Emby
#     gethomepage.dev/widget.type: "emby"
#     gethomepage.dev/widget.url: "https://emby.example.com"
#     gethomepage.dev/pod-selector: ""
#     gethomepage.dev/weight: "10"
#     gethomepage.dev/instance: "public"
# spec:
#   entryPoints:
#     - websecure
#   routes:
#     - kind: Rule
#       match: Host(`emby.example.com`)
#       services:
#         - kind: Service
#           name: emby
#           namespace: emby
#           port: 8080
#           scheme: http
#           strategy: RoundRobin
#           weight: 10
# Gateway API HttpRoute 支持
# ==================================================
# Gateway API 的 HttpRoute 注解方式与 Ingress 相同
# 启用 Gateway API：在 kubernetes.yaml 中设置 gateway: true
# ToDo:
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: emby
#   annotations:
#     gethomepage.dev/enabled: "true"
#     gethomepage.dev/description: Media Server
#     gethomepage.dev/group: Media
#     gethomepage.dev/icon: emby.png
#     gethomepage.dev/name: Emby
#     gethomepage.dev/widget.type: "emby"
#     gethomepage.dev/widget.url: "https://emby.example.com"
#     gethomepage.dev/pod-selector: ""
#     gethomepage.dev/weight: "10"
#     gethomepage.dev/instance: "public"
# spec:
#   parentRefs:
#     - name: gateway
#       namespace: default
#   hostnames:
#     - emby.example.com
#   rules:
#     - backendRefs:
#         - name: emby-service
#           port: 8080
# Helm Chart 注意事项
# ==================================================
# 如果使用非官方 Helm Chart，确保 ClusterRole 具有 gateway.networking.k8s.io 的权限
# ToDo:
# ClusterRole 配置示例
# rules:
#   - apiGroups: ["gateway.networking.k8s.io"]
#     resources: ["httproutes"]
#     verbs: ["get", "list", "watch"]

# 注意事项与限制
# ----------------------------------------------------------------------------------------------------
# 服务排序
# ==================================================
# 与 Docker 服务发现类似，发现的服务没有严格的排序规则，发现的服务会显示在 services.yaml 中手动配置的服务上方
# 额外配置文件
# ==================================================
# 某些 Homepage 功能（如 Proxmox）需要额外的配置文件（如 proxmox.yaml）
# 在 Kubernetes 中运行时，这些文件必须通过 ConfigMap 挂载到容器的 /app/config 目录
# ConfigMap 示例
# ==================================================
# ToDo:
# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: homepage
# data:
#   proxmox.yaml: |
#     pve:
#       url: https://proxmox.host.or.ip:8006
#       token: username@pam!Token ID
#       secret: secret1234567890

# 完整配置示例
# ----------------------------------------------------------------------------------------------------
