# Docker Swarm 支持
# ----------------------------------------------------------------------------------------------------
# 启用 Swarm 模式
# ==================================================
# ToDo:
# my-docker:
#   socket: /var/run/docker.sock
#   swarm: true
# 部署约束
# ==================================================
# 为确保发现所有服务，Homepage 必须部署在管理节点
# stack.yaml 配置
# ToDo:
# deploy:
#   placement:
#     constraints:
#       - node.role == manager  # 部署到管理节点
# 服务标签
# ==================================================
# Swarm 模式必须使用服务标签（deploy.labels），而不是容器标签
