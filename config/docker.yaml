# ----------------------------------------------------------------------------------------------------
# 基础 TCP 配置
# ==================================================
# 确保 Docker 实例已配置为通过 HTTP API 接受流量
# ToDo:
# my-remote-docker:
#   host: 192.168.0.101
#   port: 2375
# TLS 加密连接
# ==================================================
# 支持使用 TLS 和客户端证书认证
# ToDo:
# my-remote-docker:
#   host: 192.168.0.101
#   port: 2375
#   tls:
#     # 相对于 config 目录
