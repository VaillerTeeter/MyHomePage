# 书签配置，功能与 Services 类似，但更加简洁，仅作为外链使用

# 基本结构与配置
# ----------------------------------------------------------------------------------------------------
# 基础配置格式
# ==================================================
# abbr：2字母缩写（设计预期，但不强制）
# href：链接地址（必需）
# icon：图标路径（可选，优先级高于 abbr）
# description：自定义描述（可选，默认使用链接主机名）
# Note:
#   - 根据主题设置，书签以图标或缩写形式呈现
# ToDo:
# - Developer:
#     - Github:
#         - abbr: GH
#           href: https://github.com/
# 
# - Social:
#     - Reddit:
#         - icon: reddit.png
#           href: https://reddit.com/
#           description: The front page of the internet
# 
# - Entertainment:
#     - YouTube:
#         - abbr: YT
#           href: https://youtube.com/

# 高级配置选项
# ----------------------------------------------------------------------------------------------------
# 图标配置
# ==================================================
# 书签图标配置方式与服务图标完全相同，支持多种格式
# 图标优先级：当同时提供 icon 和 abbr 时，icon 优先显示
# 方式一：使用 Abbreviation（2字母）
# ToDo:
# - Developer:
#     - Github:
#         - abbr: GH
#           href: https://github.com/
# 方式二：使用本地图标（相对于 /app/public 目录）
# ToDo:
# - Social:
#     - Reddit:
#         - icon: reddit.png
#           href: https://reddit.com/
# 方式三：使用完整 URL
# ToDo:
# - Media:
#     - YouTube:
#         - icon: https://cdn-icons-png.flaticon.com/512/1384/1384060.png
#           href: https://youtube.com/
# 方式四：使用图标前缀（支持多种图标库）
# ToDo:
# - Tools:
#     - Docker:
#         - icon: mdi-docker
#           href: https://hub.docker.com/
# 自定义描述
# ==================================================
# 默认情况下，描述显示为链接的主机名（如 github.com），可通过 description 字段自定义
# - Social:
#     - Reddit:
#         - icon: reddit.png
#           href: https://reddit.com/
#           # 自定义描述
#           description: 社交网络与新闻聚合网站

# 布局控制
# ----------------------------------------------------------------------------------------------------
# 书签组的布局可通过 settings.yaml 中的 layout 部分进行控制：
# 仅图标布局
# ==================================================
# 针对特定书签组
# ToDo:
# layout:
#   Social:
#     iconsOnly: true
# # 全局设置（在 settings.yaml 中）
# ToDo:
# layout:
#   iconsOnly: true
# 行布局与列数
# ==================================================
# ToDo:
# layout:
#   Developer:
#     # 行布局
#     style: row
#     # 列数
#     columns: 4
# 标签页布局
# ==================================================
# ToDo:
# layout:
#   Developer:
#     # 将书签组分配到指定标签页
#     tab: Work
#   Social:
#     tab: Personal
# 最大列数限制
# ==================================================
# 书签组最大列数（默认 6，最大 8）
# maxBookmarkGroupColumns: 6

# 与 Services 的关键区别
# ----------------------------------------------------------------------------------------------------
# Bookmarks:
#   - 仅作为外部链接
#   - 简单，仅基础字段
#   - 紧凑，仅图标/缩写
#   - 适用于快速访问外部网站
# Services:
#   - 可集成 Widget 显示状态信息
#   - 复杂，支持多种 Widget 和 API 集成
#   - 较大，可显示状态、统计等信息
#   - 适用于监控服务状态、显示动态数据

# 示例
# ToDo:
# 开发工具
- Developer Tools:
    - GitHub:
        - abbr: GH
          href: https://github.com/
          description: 代码托管平台
    - Stack Overflow:
        - icon: stack-overflow.png
          href: https://stackoverflow.com/
    - VS Code Online:
        - abbr: VS
          href: https://vscode.dev/

# 社交媒体
- Social Media:
    - Twitter:
        - icon: twitter.png
          href: https://twitter.com/
    - Reddit:
        - abbr: RD
          href: https://reddit.com/
          description: 论坛社区

# 媒体娱乐
- Media & Entertainment:
    - YouTube:
        - abbr: YT
          href: https://youtube.com/
    - Netflix:
        - icon: netflix.png
          href: https://netflix.com/
    - Plex:
        - icon: mdi-plex
          href: https://plex.example.com

# 新闻资讯
- News:
    - Hacker News:
        - abbr: HN
          href: https://news.ycombinator.com/
    - TechCrunch:
        - icon: techcrunch.png
          href: https://techcrunch.com/

# 实用工具
- Utilities:
    - Speedtest:
        - abbr: ST
          href: https://www.speedtest.net/
    - Office 365:
        - icon: office365.png
          href: https://office.com/
