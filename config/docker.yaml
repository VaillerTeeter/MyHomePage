#     certFile: tls/cert.pem

# Docker Socket Proxy
# ----------------------------------------------------------------------------------------------------
# 出于安全考虑，不建议直接暴露 Docker Socket，可使用 docker-socket-proxy 容器提供受限的 API 访问
# docker-compose 配置示例
# ==================================================
# ToDo:
# services:
#   dockerproxy:
#     image: ghcr.io/tecnativa/docker-socket-proxy:latest
#     container_name: dockerproxy
#     environment:
#       - CONTAINERS=1  # 允许查看容器（必需）
#       - SERVICES=1    # 允许查看服务（Swarm 模式需要）
#       - TASKS=1       # 允许查看任务（Swarm 模式需要）
#       - POST=0        # 禁止 POST 操作（只读模式）
#     ports:
#       - 127.0.0.1:2375:2375  # 仅本地访问
#     volumes:
#       - /var/run/docker.sock:/var/run/docker.sock:ro  # 只读挂载
#     restart: unless-stopped
# 
#   homepage:
#     image: ghcr.io/gethomepage/homepage:latest
#     container_name: homepage
#     volumes:
#       - /path/to/config:/app/config
#     ports:
#       - 3000:3000
#     restart: unless-stopped
# docker.yaml 配置
# ==================================================
# ToDo:
# my-docker:
#   host: dockerproxy  # 使用 proxy 服务名
#   port: 2375
# HTTPS 连接
# ==================================================
# 仅当目标主机支持 HTTPS 时才使用 protocol: https，不需要 TLS 证书
# 如果通过反向代理（如 Traefik）提供 HTTPS 服务
# ToDo:
# my-docker:
#   host: dockerproxy
#   port: 443
#   protocol: https  # 启用 HTTPS
# 带认证的反向代理
# ToDo:
# my-docker:
#   host: dockerproxy
#   port: 443
#   protocol: https
#   headers:
#     Authorization: Basic <base64-encoded-credentials>

# 直接使用 Socket
# ----------------------------------------------------------------------------------------------------
# 使用 Socket 时，Homepage 必须以 root 用户运行
# docker-compose 配置
# ==================================================
# ToDo:
# homepage:
#   image: ghcr.io/gethomepage/homepage:latest
#   container_name: homepage
#   volumes:
#     - /path/to/config:/app/config
#     - /var/run/docker.sock:/var/run/docker.sock  # 挂载 Docker Socket
#   ports:
#     - 3000:3000
#   restart: unless-stopped
# docker.yaml 配置
# ==================================================
# ToDo:
# my-docker:
#   socket: /var/run/docker.sock

# 服务配置与容器关联
# ----------------------------------------------------------------------------------------------------
# 配置 Docker 实例后，可在服务中关联容器以显示统计和状态
# 交互功能：点击服务状态指示器可展开容器统计信息（CPU、内存、网络活动）
# ToDo:
# - Emby:
#     icon: emby.png
#     href: "http://emby.home/"
#     description: Media server
#     # docker.yaml 中配置的服务器名称
#     server: my-docker
#     # 要连接的容器名称
#     container: emby

