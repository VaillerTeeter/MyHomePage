# 用于集成 Proxmox VE 虚拟化平台监控

# 前置要求
# ----------------------------------------------------------------------------------------------------
# Proxmox VE：6.x 或 7.x 版本
# API Token：需要创建具有适当权限的 API 令牌
# 网络连通性：Homepage 必须能访问 Proxmox 管理接口（默认端口 8006）

# Proxmox 连接配置
# ----------------------------------------------------------------------------------------------------
# 基础配置
# ==================================================
# 必须与实际的 Proxmox 节点名称匹配
# Note:
#   - pve：配置键名，必须与 services.yaml 中的 proxmoxNode 字段匹配
#   - url：Proxmox 管理界面完整 URL（必须包含 https）
#   - token：API 令牌标识（格式：用户名@认证域!令牌ID）
#   - secret：API 令牌的密钥
# ToDo:
# pve:
#   url: https://proxmox.host.or.ip:8006
#   token: username@pam!Token ID
#   secret: secret1234567890
# 多节点配置
# ==================================================
# ToDo:
# pve-node1:
#   url: https://192.168.1.100:8006
#   token: api@pam!homepage
#   secret: secret1111111111
# 
# pve-node2:
#   url: https://192.168.1.101:8006
#   token: api@pam!homepage
#   secret: secret2222222222

# 服务配置
# ----------------------------------------------------------------------------------------------------
# 配置选项
# ==================================================
# proxmoxNode：Proxmox 节点名称，需匹配 `proxmox.yaml` 中的键名
# proxmoxVMID：VM 或 LXC 容器的 ID（在 Proxmox 界面中显示的数字）
# proxmoxType：虚拟机类型：`qemu`（默认）或 `lxc`
# QEMU 虚拟机示例
# ==================================================
# ToDo:
# - HomeAssistant:
#     icon: home-assistant.png
#     href: http://homeassistant.local/
#     description: Home automation
#     proxmoxNode: pve
#     proxmoxVMID: 101
#     # 默认值，可省略
#     # proxmoxType: qemu
# LXC 容器示例
# ==================================================
# ToDo:
# - Nginx:
#     icon: nginx.png
#     href: http://nginx.local/
#     description: Web server
#     proxmoxNode: pve
#     proxmoxVMID: 200
#     # 明确指定为 LXC 容器
#     proxmoxType: lxc
# 多节点混合示例
# ==================================================
# ToDo:
# - Production VMs:
#     - Database Server:
#         icon: postgresql.png
#         href: http://db.local/
#         description: PostgreSQL Database
#         # 运行在 node1
#         proxmoxNode: pve-node1
#         proxmoxVMID: 105
# 
#     - Redis Cache:
#         icon: redis.png
#         href: http://redis.local/
#         description: Redis Cache
#         # 运行在 node2
#         proxmoxNode: pve-node2
#         proxmoxVMID: 110
#         proxmoxType: lxc

